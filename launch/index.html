<!DOCTYPE html>
<html lang="as">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Artho — সোনকালেই আহি আছে</title>
<meta name="description" content="শব্দ আছে। অৰ্থটো ক'ত? Artho — the Assamese dictionary app — is coming soon.">
<meta name="theme-color" content="#0a0a0d">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0a0d'/%3E%3Ctext x='32' y='44' font-size='36' text-anchor='middle' fill='%23F0BE55' font-family='serif'%3E%E0%A6%85%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@900&family=Noto+Sans+Bengali:wght@400;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:#0a0a0d; color:#FFF6E9;
    font-family:'Noto Sans Bengali',system-ui,sans-serif;
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:40px 24px; text-align:center; position:relative; overflow:hidden;
  }
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none;
    background:radial-gradient(520px 340px at 50% 30%, rgba(240,190,85,.12), transparent 70%);
  }
  .particle{
    position:fixed; bottom:-8vh; z-index:0; pointer-events:none;
    color:#F0BE55; opacity:0; font-family:'Noto Serif Bengali',serif;
    animation:rise linear infinite;
  }
  @keyframes rise{
    0%{transform:translateY(0) rotate(0deg); opacity:0}
    12%{opacity:.26}
    85%{opacity:.10}
    100%{transform:translateY(-115vh) rotate(28deg); opacity:0}
  }
  main{position:relative; width:100%; max-width:480px}
  h1{
    font-family:'Noto Serif Bengali',serif; font-weight:900;
    font-size:clamp(42px,11vw,64px); line-height:1.4; margin-bottom:30px;
    min-height:2.8em;
  }
  h1 .l1{color:#FFF6E9; display:block}
  h1 .l2{color:#F0BE55; display:block}
  .cursor{
    display:inline-block; width:.55em; height:1.05em; background:#F0BE55;
    vertical-align:-.12em; margin-left:.06em; animation:blink 1s steps(1) infinite;
  }
  @keyframes blink{ 0%,55%{opacity:1} 56%,100%{opacity:0} }
  .soon{color:#b9a98f; font-size:17px; opacity:0; transition:opacity 1.2s ease}
  .soon.shown{opacity:1}
  @media (prefers-reduced-motion:reduce){
    .cursor{animation:none} .soon{opacity:1; transition:none}
  }
</style>
</head>
<body>
<main>
  <h1 aria-label="শব্দ আছে। অৰ্থটো ক'ত?"><span class="l1" id="line1"></span><span class="l2" id="line2"></span></h1>
  <p class="soon" id="soon">সোনকালেই আহি আছে</p>
</main>
<script>
  // typewriter headline (grapheme-safe for Assamese script)
  const LINES = [
    { el: document.getElementById('line1'), text: 'শব্দ আছে।' },
    { el: document.getElementById('line2'), text: "অৰ্থটো ক'ত?" }
  ];
  const soon = document.getElementById('soon');
  const cursor = document.createElement('span');
  cursor.className = 'cursor';
  cursor.setAttribute('aria-hidden', 'true');

  function graphemes(str) {
    if (window.Intl && Intl.Segmenter) {
      return [...new Intl.Segmenter('as', { granularity: 'grapheme' }).segment(str)]
        .map(s => s.segment);
    }
    return [...str];
  }
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  async function typeLine(line) {
    line.el.appendChild(cursor);
    for (const g of graphemes(line.text)) {
      line.el.insertBefore(document.createTextNode(g), cursor);
      await sleep(85 + Math.random() * 70);
    }
  }

  (async () => {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      LINES.forEach(l => l.el.textContent = l.text);
      soon.classList.add('shown');
      return;
    }
    await sleep(500);
    await typeLine(LINES[0]);
    await sleep(450);
    await typeLine(LINES[1]);
    await sleep(600);
    soon.classList.add('shown');
  })();

  // floating Assamese letter particles
  const letters = ['অ','আ','ক','খ','গ','চ','জ','ট','ত','প','ম','য','ৰ','ল','শ','স','হ','ং'];
  for (let i = 0; i < 16; i++) {
    const s = document.createElement('span');
    s.className = 'particle';
    s.textContent = letters[Math.floor(Math.random() * letters.length)];
    s.style.left = (Math.random() * 100) + 'vw';
    s.style.fontSize = (14 + Math.random() * 26) + 'px';
    s.style.animationDuration = (9 + Math.random() * 10) + 's';
    s.style.animationDelay = (Math.random() * 12) + 's';
    document.body.appendChild(s);
  }
</script>
</body>
</html>
