<!DOCTYPE html>
<html lang="as">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Artho — সোনকালেই আহি আছে</title>
<meta name="description" content="শব্দ আছে। অৰ্থটো ক'ত? Artho — the Assamese dictionary app — is coming soon.">
<meta name="theme-color" content="#f6f1e7">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23f6f1e7'/%3E%3Ctext x='32' y='44' font-size='36' text-anchor='middle' fill='%231a1a1a' font-family='serif'%3E%E0%A6%85%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@900&family=Noto+Sans+Bengali:wght@400;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:#f6f1e7; color:#1a1a1a;
    font-family:'Noto Sans Bengali',system-ui,sans-serif;
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:40px 24px; text-align:center; position:relative; overflow:hidden;
  }
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none;
    background:radial-gradient(600px 400px at 50% 40%, rgba(138,109,26,.06), transparent 70%);
  }
  main{position:relative; width:100%; max-width:520px}
  .mark{
    font-family:'Noto Serif Bengali',serif; font-weight:900; font-size:30px;
    margin-bottom:34px; letter-spacing:1px;
  }
  h1{
    font-family:'Noto Serif Bengali',serif; font-weight:900;
    font-size:clamp(42px,11vw,64px); line-height:1.4; margin-bottom:34px;
    min-height:2.8em;
  }
  h1 .l1{color:#1a1a1a; display:block}
  h1 .l2{color:#8a6d1a; display:block}
  .cursor{
    display:inline-block; width:.5em; height:1em; background:#1a1a1a;
    vertical-align:-.1em; margin-left:.06em; animation:blink 1s steps(1) infinite;
  }
  @keyframes blink{ 0%,55%{opacity:1} 56%,100%{opacity:0} }
  .rule{width:56px; height:2px; background:#1a1a1a; opacity:.25; margin:0 auto 26px}
  .soon{color:#6b6252; font-size:17px; opacity:0; transition:opacity 1.2s ease}
  .soon.shown{opacity:1}
  @media (prefers-reduced-motion:reduce){
    .cursor{animation:none} .soon{opacity:1; transition:none}
  }
</style>
</head>
<body>
<main>
  <div class="mark">অৰ্থ</div>
  <h1 aria-label="শব্দ আছে। অৰ্থটো ক'ত?"><span class="l1" id="line1"></span><span class="l2" id="line2"></span></h1>
  <div class="rule"></div>
  <p class="soon" id="soon">সোনকালেই আহি আছে</p>
</main>
<script>
  const LINES = [
    { el: document.getElementById('line1'), text: 'শব্দ আছে।' },
    { el: document.getElementById('line2'), text: "অৰ্থটো ক'ত?" }
  ];
  const soon = document.getElementById('soon');
  const cursor = document.createElement('span');
  cursor.className = 'cursor';
  cursor.setAttribute('aria-hidden', 'true');

  function graphemes(str) {
    if (window.Intl && Intl.Segmenter) {
      return [...new Intl.Segmenter('as', { granularity: 'grapheme' }).segment(str)]
        .map(s => s.segment);
    }
    return [...str];
  }
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  async function typeLine(line) {
    line.el.appendChild(cursor);
    for (const g of graphemes(line.text)) {
      line.el.insertBefore(document.createTextNode(g), cursor);
      await sleep(85 + Math.random() * 70);
    }
  }

  (async () => {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      LINES.forEach(l => l.el.textContent = l.text);
      soon.classList.add('shown');
      return;
    }
    await sleep(500);
    await typeLine(LINES[0]);
    await sleep(450);
    await typeLine(LINES[1]);
    await sleep(600);
    soon.classList.add('shown');
  })();
</script>
</body>
</html>
